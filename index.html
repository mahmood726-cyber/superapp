<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Living Meta-Analysis Platform - CT.gov-Only | Post-2005 Pharma RCTs">
  <meta name="theme-color" content="#2563eb">
  <title>Living Meta-Analysis</title>

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">Living Meta</span>
      </div>

      <nav class="sidebar-nav" id="nav">
        <!-- Navigation populated by app.js -->
      </nav>

      <div class="sidebar-footer" style="padding: 1rem; border-top: 1px solid var(--color-border);">
        <div class="text-xs text-muted">Version 1.0.0</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <button class="btn btn-ghost btn-icon" id="menu-toggle" aria-label="Toggle menu">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
            </svg>
          </button>
          <div class="header-breadcrumb" id="breadcrumb">
            <!-- Breadcrumb populated by router -->
          </div>
        </div>

        <div class="header-right">
          <button class="btn btn-ghost btn-icon" id="theme-toggle" aria-label="Toggle theme">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" id="theme-icon">
              <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content" id="main-outlet">
        <!-- Page content populated by router -->
        <div class="loading-overlay" id="loading">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <lm-toast id="toast"></lm-toast>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
